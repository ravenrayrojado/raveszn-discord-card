<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAVESZN CLUB!</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #11131a;
    }

    .card {
      width: 360px;
      padding: 24px;
      border-radius: 20px;
      background: rgba(35, 38, 48, 0.95);
      color: white;
      text-align: center;
    }

    .icon {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      margin: 0 auto 14px;
      object-fit: cover;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 24px;
    }

    .stats {
      color: #b5bac1;
      margin-bottom: 20px;
      font-size: 15px;
    }

    .join {
      display: block;
      padding: 12px;
      border-radius: 10px;
      background: #5865f2;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .join:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>
  <div class="card">
    <img id="icon" class="icon" src="" alt="Server Icon">

    <h1 id="name">RAVESZN CLUB!</h1>

    <div class="stats">
      🟢 <span id="online">--</span> ONLINE
      •
      👥 <span id="members">--</span> MEMBERS
    </div>

    <a
      class="join"
      href="https://discord.gg/TvyZ2VjQMg"
      target="_blank"
    >
      JOIN
    </a>
  </div>

  <script>
    async function updateStats() {
      try {
        const response = await fetch("/api/stats");
        const data = await response.json();

        if (data.status === "error") return;

        document.getElementById("name").textContent =
          data.name || "RAVESZN CLUB!";

        document.getElementById("online").textContent =
          data.online ?? 0;

        document.getElementById("members").textContent =
          data.members ?? 0;

        if (data.icon) {
          document.getElementById("icon").src =
            `https://cdn.discordapp.com/icons/399904586824941568/${data.icon}.png?size=256`;
        }
      } catch (error) {
        console.error(error);
      }
    }

    updateStats();

    setInterval(updateStats, 60000);
  </script>
</body>
</html>
